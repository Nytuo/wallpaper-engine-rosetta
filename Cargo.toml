[workspace]
resolver = "2"
members = [
    "scene",
    "video",
    "engine",
    "ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["BEUX Arnaud - Nytuo"]
repository = "https://github.com/Nytuo/wallpaper-engine-rosetta"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 4
